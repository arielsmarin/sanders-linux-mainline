# Sanders: SSH por senha E por chave (preferencia do usuario, estilo VPS).
# ATENCAO: sem firewall/fail2ban neste kernel -> a protecao contra brute-force
# vem do Cloudflare Access na frente do hostname SSH. Senha de root TEM que
# ser forte ANTES de criar o hostname SSH no tunnel.
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers root
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 120
ClientAliveCountMax 2

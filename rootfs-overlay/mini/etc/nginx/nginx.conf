worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 30;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

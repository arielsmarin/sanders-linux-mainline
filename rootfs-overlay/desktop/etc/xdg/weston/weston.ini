[core]
backend=drm
xwayland=true
idle-time=0
require-input=false
screenshooter=/usr/bin/weston-screenshooter

[shell]
locking=false
panel-position=bottom

[output]
name=Unknown-1
transform=rotate-270
# Tela 1080x1920 num painel ~5.5" = ~400 DPI. Sem scale tudo fica
# minusculo. scale=3 -> resolucao logica 360x640, tudo 3x maior.
# Renderer pixman (CPU) aguenta numa boa porque a area pintada cai
# pra 1/9 e o upscale e barato.
scale=3
